<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="./Prop3.css">
</head>
<body>
    <h2>Event Participation Registration form</h2>
    <form action="https://sode-edu.in/sode_events/food-fiesta-mba-food-fest/">
        <input type="text" placeholder="UserName" minlength="4" maxlength="20"><br>
        <input type="password" placeholder="password"  minlength="8" maxlength="15"><br>
        <input type="email" placeholder="Email Id"><br>
        <input type="Number" placeholder="Phone number"> <br>
        <input type="Number" placeholder="Age" min="18" max="45"><br><br>
        <label style="font-family:'Courier New', Courier, monospace;">Gender:</label> <br>
        <input type="radio" name="a" disabled>Male <br>
        <input type="radio" name="a" checked>Female <br>
        <input type="radio" name="a" disabled>Others <br><br>

        <label>State</label>
        <select>
            <option value="1">Select</option>
            <option value="2">Andhra Pradesh</option>
            <option value="3">Arunachal Pradesh</option>
            <option value="4">Assam</option>
            <option value="5">Bihar</option>
            <option value="6">Chhattisgarh</option>
            <option value="7">Goa</option>
            <option value="8">Gujarat</option>
            <option value="9">Haryana</option>
            <option value="10">Himachal Pradesh</option>
            <option value="11">Jharkhand</option>
            <option value="12">Karnataka</option>
            <option value="13">Kerala</option>
        </select>
        <br><br>
        <input type="text" placeholder="City">
        <br><br>
        <label>Select the Events your are going to participate</label> <br>
        <input type="checkbox">Bharathantya <br>
        <input type="checkbox">Break Dance <br>
        <input type="checkbox">Drawing <br>
        <input type="checkbox">singing <br>
        <input type="checkbox">BikeRace <br><br>

        <label>upload a file related to your Competition</label> <br>
        <input type="file"><br><br>

        <input type="Submit" value="Login">
    </form>
</body>
</html>
