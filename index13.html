<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Psedo Selector</title>
    <style>
        a{
            text-decoration: none;
        }
        a:link{
            color: red;
        }
        a:visited{
            color: greenyellow;
        }
        a:hover{
            text-decoration: line-through;
        }
        a:active{
            background-color: crimson;
        }

    </style>
</head>
<body>
    <a href="https://huggingface.co/">huggingface</a>
    <br>
    <a href="www.ideogram.io">ideogram</a>
    <br>
    <a href="www.copilot.co">copilot</a>
    <br>
</body>
</html>
